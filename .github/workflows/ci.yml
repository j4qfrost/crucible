name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11", "1.12"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      # poppler-utils provides pdftotext for the PDFAdapter tests.
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Resolve + test
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project -e 'using Pkg; Pkg.test()'

      # Hygiene: catches schema-bump drift before review. Round-trips
      # every fixture through every registered migration target and
      # asserts Gate 1 still passes.
      - name: Migration smoke
        run: julia --project tools/migration_smoke.jl

      # Hygiene: docs/IR.md is auto-generated from schema.json. CI
      # regenerates it and asserts the working copy matches what's
      # checked in. Catches "I forgot to run regenerate_docs.jl" drift.
      - name: IR.md drift check
        run: |
          cp docs/IR.md /tmp/IR.md.before
          julia --project tools/regenerate_docs.jl
          diff -u /tmp/IR.md.before docs/IR.md || {
            echo
            echo "::error::docs/IR.md is out of date — run \`julia --project tools/regenerate_docs.jl\` and commit"
            exit 1
          }

  # Reproducible-toolchain gate via Nix. Builds the pinned dev shell from
  # flake.nix (pinned-tarball nixpkgs → julia + duckdb + poppler) and drives
  # Pkg.instantiate + Pkg.status through `nix develop`. Proves the flake
  # resolves and runs the project independent of julia-actions setup. See the
  # IMPURITY NOTE in flake.nix for why there's a dev shell but no pure package.
  nix-julia:
    name: Nix dev shell (flake) + Pkg.instantiate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: julia --version via nix develop
        run: nix develop -c julia --version

      - name: Pkg.instantiate via nix develop
        run: nix develop -c julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.status()'

  # Air-gap audit: workspace consistency + egress-baseline gate +
  # `crucible-py doctor --offline`. Pure-Python; finishes in seconds.
  # Failing this means a new outbound-network call site landed without
  # an explicit baseline bump (tools/baselines/egress.json) + an
  # AIR_GAPPED.md update — block the PR until both happen.
  air-gap-audit:
    name: Air-gap audit (workspace + egress baseline + doctor --offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python bindings (with anthropic extra for doctor)
        run: |
          python -m pip install --upgrade pip
          pip install -e "python[llm-anthropic]"

      - name: Run composite air-gap audit
        # --skip-julia keeps this job fast; the Julia doctor surface is
        # already exercised in cmd-doctor smoke under Pkg.test().
        run: ./tools/audit_offline.sh --skip-julia

  # Live OpenMM + PDBFixer + mdtraj smoke. Installs OpenMM into a venv
  # and re-runs Pkg.test() with CRUCIBLE_RUN_OPENMM=1 so the
  # integration_test.jl live testset actually exercises OpenMM against
  # the alanine-dipeptide fixture. Only on Julia 1.10 to keep total
  # build time reasonable.
  openmm-smoke:
    name: Live OpenMM smoke (Julia 1.10 only)
    runs-on: ubuntu-latest
    needs: test
    env:
      CRUCIBLE_RUN_OPENMM: "1"
      CRUCIBLE_PLATFORM: "CPU"
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - uses: julia-actions/cache@v2

      - name: Install OpenMM + PDBFixer + mdtraj
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-pip python3-venv poppler-utils
          python3 -m venv /opt/openmm-venv
          /opt/openmm-venv/bin/pip install --quiet --no-cache-dir openmm pdbfixer mdtraj
          echo "/opt/openmm-venv/bin" >> $GITHUB_PATH
          /opt/openmm-venv/bin/python -c 'import openmm; print("OpenMM", openmm.__version__)'

      - name: Resolve + test (with OpenMM live)
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project -e 'using Pkg; Pkg.test()'
