name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      # poppler-utils provides pdftotext for the PDFAdapter tests.
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Resolve + test
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project -e 'using Pkg; Pkg.test()'

  # Live OpenMM + PDBFixer + mdtraj smoke. Installs OpenMM into a venv
  # and re-runs Pkg.test() with CRUCIBLE_RUN_OPENMM=1 so the
  # integration_test.jl live testset actually exercises OpenMM against
  # the alanine-dipeptide fixture. Only on Julia 1.10 to keep total
  # build time reasonable.
  openmm-smoke:
    name: Live OpenMM smoke (Julia 1.10 only)
    runs-on: ubuntu-latest
    needs: test
    env:
      CRUCIBLE_RUN_OPENMM: "1"
      CRUCIBLE_PLATFORM: "CPU"
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - uses: julia-actions/cache@v2

      - name: Install OpenMM + PDBFixer + mdtraj
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-pip python3-venv poppler-utils
          python3 -m venv /opt/openmm-venv
          /opt/openmm-venv/bin/pip install --quiet --no-cache-dir openmm pdbfixer mdtraj
          echo "/opt/openmm-venv/bin" >> $GITHUB_PATH
          /opt/openmm-venv/bin/python -c 'import openmm; print("OpenMM", openmm.__version__)'

      - name: Resolve + test (with OpenMM live)
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project -e 'using Pkg; Pkg.test()'
