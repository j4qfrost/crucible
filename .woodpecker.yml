when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

# Override the default clone step to use the docker-internal Forgejo URL.
# Woodpecker rewrites repos.clone back to the public URL on each webhook
# resync, and the public URL (Tailscale Serve) isn't reachable from inside
# the docker bridge that step containers run on. See ~/infra/ci/README.md.
clone:
  git:
    image: alpine/git
    environment:
      FORGEJO_USER:
        from_secret: forgejo_user
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - git init -b "${CI_COMMIT_BRANCH:-main}"
      - >-
        git fetch --depth=1 "http://$$FORGEJO_USER:$$FORGEJO_TOKEN@forgejo:3000/${CI_REPO}.git" "$$CI_COMMIT_SHA"
        || git fetch --depth=1 "http://$$FORGEJO_USER:$$FORGEJO_TOKEN@forgejo:3000/${CI_REPO}.git" "$$CI_COMMIT_REF"
        || git fetch --depth=1 "https://$$FORGEJO_USER:$$FORGEJO_TOKEN@git.legionofweird.dev/${CI_REPO}.git" "$$CI_COMMIT_SHA"
        || git fetch --depth=1 "https://$$FORGEJO_USER:$$FORGEJO_TOKEN@git.legionofweird.dev/${CI_REPO}.git" "$$CI_COMMIT_REF"
      - git checkout -qf FETCH_HEAD

# Julia drug-discovery sim. The OpenMM backend (PythonCall + CondaPkg) is
# intentionally optional and isn't installed here — keeps CI lean and matches
# the project's "native Julia path is MollyBackend" default.
# `Pkg.test()` uses the package's own `test/` runner.

matrix:
  JULIA_VERSION:
    - "1.10"
    - "1.11"
    - "1.12"

steps:
  test:
    image: julia:${JULIA_VERSION}
    environment:
      JULIA_DEPOT_PATH: /woodpecker/depot
      JULIA_NUM_THREADS: "2"
    commands:
      # poppler-utils provides pdftotext for PDFAdapter tests
      - apt-get update -qq && apt-get install -y --no-install-recommends poppler-utils python3-pip python3-venv
      - julia --version
      - pdftotext -v 2>&1 | head -1 || echo "pdftotext not found — PDF tests will skip"
      - julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  # Reproducible-toolchain gate: build the pinned dev shell from flake.nix and
  # drive the same Pkg.instantiate + Pkg.test through `nix develop`. This proves
  # the flake's pinned julia + duckdb + poppler toolchain actually resolves and
  # runs the project, independent of the `julia:${JULIA_VERSION}` base images.
  # The nix image needs flakes enabled (NIX_CONFIG); `nix develop` pulls julia
  # from cache.nixos.org, then Pkg.instantiate hits the Julia General registry
  # (network-impure by design — see the IMPURITY NOTE in flake.nix).
  nix-julia:
    image: nixos/nix:2.24.9
    environment:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      JULIA_DEPOT_PATH: /woodpecker/depot
      JULIA_NUM_THREADS: "2"
    commands:
      - nix --version
      - nix develop -c julia --version
      - nix develop -c julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.status()'
    when:
      matrix:
        JULIA_VERSION: "1.10"

  # Hygiene: every-fixture × every-migration round-trip + Gate 1 check.
  migration-smoke:
    image: julia:${JULIA_VERSION}
    environment:
      JULIA_DEPOT_PATH: /woodpecker/depot
    commands:
      - julia --project -e 'using Pkg; Pkg.instantiate()'
      - julia --project tools/migration_smoke.jl
    depends_on:
      - test

  # Hygiene: docs/IR.md must be in sync with schema.json.
  ir-md-drift:
    image: julia:${JULIA_VERSION}
    environment:
      JULIA_DEPOT_PATH: /woodpecker/depot
    commands:
      - julia --project -e 'using Pkg; Pkg.instantiate()'
      - cp docs/IR.md /tmp/IR.md.before
      - julia --project tools/regenerate_docs.jl
      - diff -u /tmp/IR.md.before docs/IR.md || (echo "docs/IR.md is stale — run julia --project tools/regenerate_docs.jl" && exit 1)
    depends_on:
      - test
    when:
      matrix:
        JULIA_VERSION: "1.10"

  # NOTE: live Anthropic LLM smoke is run via the openmm-smoke step when both
  # ANTHROPIC_API_KEY and CRUCIBLE_RUN_ANTHROPIC are set in the Woodpecker repo
  # secrets. To enable: in the Woodpecker UI, add a repo secret named
  # `anthropic_api_key` and reference it via `from_secret` in a custom step.
  # Kept out of this baseline pipeline to avoid YAML rejection when the secret
  # doesn't exist yet.

  # Live OpenMM smoke. Installs OpenMM into a venv, exports CRUCIBLE_RUN_OPENMM,
  # re-runs Pkg.test() so the integration_test.jl live testset actually hits
  # OpenMM against the alanine-dipeptide fixture. Only on Julia 1.10 to keep
  # total build time reasonable.
  openmm-smoke:
    image: julia:${JULIA_VERSION}
    environment:
      JULIA_DEPOT_PATH: /woodpecker/depot
      JULIA_NUM_THREADS: "2"
      CRUCIBLE_RUN_OPENMM: "1"
      CRUCIBLE_PLATFORM: "CPU"
    commands:
      - apt-get update -qq && apt-get install -y --no-install-recommends python3-pip python3-venv poppler-utils
      - python3 -m venv /opt/openmm-venv
      - /opt/openmm-venv/bin/pip install --quiet --no-cache-dir openmm pdbfixer mdtraj
      - export PATH=/opt/openmm-venv/bin:$PATH
      - python -c 'import openmm; print("OpenMM", openmm.__version__)'
      - julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
    depends_on:
      - test
    when:
      matrix:
        JULIA_VERSION: "1.10"
