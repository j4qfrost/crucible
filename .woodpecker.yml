when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

# Julia drug-discovery sim. The OpenMM backend (PythonCall + CondaPkg) is
# intentionally optional and isn't installed here — keeps CI lean and matches
# the project's "native Julia path is MollyBackend" default.
# `Pkg.test()` uses the package's own `test/` runner.

matrix:
  JULIA_VERSION:
    - "1.10"
    - "1.11"

steps:
  test:
    image: julia:${JULIA_VERSION}
    environment:
      JULIA_DEPOT_PATH: /woodpecker/depot
      JULIA_NUM_THREADS: "2"
    commands:
      # poppler-utils provides pdftotext for PDFAdapter tests
      - apt-get update -qq && apt-get install -y --no-install-recommends poppler-utils
      - julia --version
      - pdftotext -v 2>&1 | head -1 || echo "pdftotext not found — PDF tests will skip"
      - julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
