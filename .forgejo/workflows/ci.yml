# Forgejo Actions CI for crucible. Julia matrix (1.10 / 1.11 / 1.12) for the
# test suite + migration smoke; the toolchain, docs-drift and OpenMM gates run
# once on 1.10 (the floor in Project.toml).

name: ci
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

defaults:
  run:
    shell: sh

jobs:
  test:
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.10", "1.11", "1.12"]
    container:
      image: julia:${{ matrix.julia }}
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: checkout
        # Fleet checkout (CI-MIGRATION-RUNBOOK.md): job images may lack git/node.
        uses: docker://alpine/git:2.54.1
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        with:
          entrypoint: /bin/sh
          args: -ec "u=${FORGE_CLONE_BASE:-https://git.legionofweird.dev}; u=${u%%://*}://ci:$TOKEN@${u#*://}/$REPO.git; git init -q; git fetch -q --depth=1 $u $SHA || git fetch -q --depth=1 $u $REF; git checkout -qf FETCH_HEAD"

      - name: test
        run: |
          # poppler-utils provides pdftotext for PDFAdapter tests
          apt-get update -qq && apt-get install -y --no-install-recommends poppler-utils python3-pip python3-venv
          julia --version
          pdftotext -v 2>&1 | head -1 || echo "pdftotext not found — PDF tests will skip"
          julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  # Reproducible-toolchain gate: build the pinned dev shell from flake.nix and
  # drive the same Pkg.instantiate + Pkg.test through `nix develop`. This proves
  # the flake's pinned julia + duckdb + poppler toolchain actually resolves and
  # runs the project, independent of the `julia:<version>` base images.
  # The nix image needs flakes enabled (NIX_CONFIG); `nix develop` pulls julia
  # from cache.nixos.org, then Pkg.instantiate hits the Julia General registry
  # (network-impure by design — see the IMPURITY NOTE in flake.nix).
  nix-julia:
    runs-on: docker
    container:
      image: nixos/nix:2.24.9
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      JULIA_NUM_THREADS: "2"
    steps:
      - name: checkout
        # Fleet checkout (CI-MIGRATION-RUNBOOK.md): job images may lack git/node.
        uses: docker://alpine/git:2.54.1
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        with:
          entrypoint: /bin/sh
          args: -ec "u=${FORGE_CLONE_BASE:-https://git.legionofweird.dev}; u=${u%%://*}://ci:$TOKEN@${u#*://}/$REPO.git; git init -q; git fetch -q --depth=1 $u $SHA || git fetch -q --depth=1 $u $REF; git checkout -qf FETCH_HEAD"

      - name: nix-julia
        run: |
          nix --version
          nix develop -c julia --version
          nix develop -c julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.status()'

  # Hygiene: every-fixture × every-migration round-trip + Gate 1 check.
  migration-smoke:
    runs-on: docker
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.10", "1.11", "1.12"]
    container:
      image: julia:${{ matrix.julia }}
    steps:
      - name: checkout
        # Fleet checkout (CI-MIGRATION-RUNBOOK.md): job images may lack git/node.
        uses: docker://alpine/git:2.54.1
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        with:
          entrypoint: /bin/sh
          args: -ec "u=${FORGE_CLONE_BASE:-https://git.legionofweird.dev}; u=${u%%://*}://ci:$TOKEN@${u#*://}/$REPO.git; git init -q; git fetch -q --depth=1 $u $SHA || git fetch -q --depth=1 $u $REF; git checkout -qf FETCH_HEAD"

      - name: migration-smoke
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project tools/migration_smoke.jl

  # Hygiene: docs/IR.md must be in sync with schema.json.
  ir-md-drift:
    runs-on: docker
    needs: [test]
    container:
      image: julia:1.10
    steps:
      - name: checkout
        # Fleet checkout (CI-MIGRATION-RUNBOOK.md): job images may lack git/node.
        uses: docker://alpine/git:2.54.1
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        with:
          entrypoint: /bin/sh
          args: -ec "u=${FORGE_CLONE_BASE:-https://git.legionofweird.dev}; u=${u%%://*}://ci:$TOKEN@${u#*://}/$REPO.git; git init -q; git fetch -q --depth=1 $u $SHA || git fetch -q --depth=1 $u $REF; git checkout -qf FETCH_HEAD"

      - name: ir-md-drift
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          cp docs/IR.md /tmp/IR.md.before
          julia --project tools/regenerate_docs.jl
          diff -u /tmp/IR.md.before docs/IR.md || (echo "docs/IR.md is stale — run julia --project tools/regenerate_docs.jl" && exit 1)

  # NOTE: a live Anthropic LLM smoke can be added as a job gated on an
  # ANTHROPIC_API_KEY repo secret + CRUCIBLE_RUN_ANTHROPIC; kept out of this
  # baseline workflow until the secret exists.

  # Live OpenMM smoke. Installs OpenMM into a venv, exports CRUCIBLE_RUN_OPENMM,
  # re-runs Pkg.test() so the integration_test.jl live testset actually hits
  # OpenMM against the alanine-dipeptide fixture. Only on Julia 1.10 to keep
  # total build time reasonable.
  openmm-smoke:
    runs-on: docker
    needs: [test]
    container:
      image: julia:1.10
    env:
      JULIA_NUM_THREADS: "2"
      CRUCIBLE_RUN_OPENMM: "1"
      CRUCIBLE_PLATFORM: "CPU"
    steps:
      - name: checkout
        # Fleet checkout (CI-MIGRATION-RUNBOOK.md): job images may lack git/node.
        uses: docker://alpine/git:2.54.1
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        with:
          entrypoint: /bin/sh
          args: -ec "u=${FORGE_CLONE_BASE:-https://git.legionofweird.dev}; u=${u%%://*}://ci:$TOKEN@${u#*://}/$REPO.git; git init -q; git fetch -q --depth=1 $u $SHA || git fetch -q --depth=1 $u $REF; git checkout -qf FETCH_HEAD"

      - name: openmm-smoke
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends python3-pip python3-venv poppler-utils
          python3 -m venv /opt/openmm-venv
          /opt/openmm-venv/bin/pip install --quiet --no-cache-dir openmm pdbfixer mdtraj
          export PATH=/opt/openmm-venv/bin:$PATH
          python -c 'import openmm; print("OpenMM", openmm.__version__)'
          julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
